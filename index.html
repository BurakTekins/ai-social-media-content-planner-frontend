<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('social-plan-theme');
        const dark = savedTheme
          ? savedTheme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#090c10' : '#f5f7fa');
      })();
    </script>
    <meta
      name="description"
      content="Yapay zeka destekli sosyal medya içerik üretim ve planlama paneli"
    />
    <title>İçerik Planlayıcı</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
